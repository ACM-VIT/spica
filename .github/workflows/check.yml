name: Linux checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config autoconf automake libtool \
            libsqlite3-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev \
            libegl1-mesa-dev libgl1-mesa-dev libdrm-dev libgbm-dev libpng-dev \
            zlib1g-dev libbz2-dev python3 python3-venv curl xz-utils
      - name: Install pinned check tools
        run: |
          curl --fail --location --output "$RUNNER_TEMP/zig.tar.xz" \
            https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $RUNNER_TEMP/zig.tar.xz" | sha256sum --check
          tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
          python3 -m venv "$RUNNER_TEMP/check-tools"
          "$RUNNER_TEMP/check-tools/bin/pip" install clang-format==22.1.8
          echo "$RUNNER_TEMP/check-tools/bin" >> "$GITHUB_PATH"
      - name: Bootstrap checksum-locked dependencies
        run: python3 build/bootstrap.py
      - name: Check Debug and ReleaseSafe
        run: ./tools/check
